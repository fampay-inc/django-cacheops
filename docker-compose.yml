services:
  valkey-node-1:
    image: valkey/valkey:8.1-alpine
    container_name: valkey-node-1
    command: >
      valkey-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 7001
      --cluster-announce-bus-port 17001
      --bind 0.0.0.0
    ports:
      - "7001:7001"
      - "17001:17001"
    network_mode: "host"

  valkey-node-2:
    image: valkey/valkey:8.1-alpine
    container_name: valkey-node-2
    command: >
      valkey-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 7002
      --cluster-announce-bus-port 17002
      --bind 0.0.0.0
    ports:
      - "7002:7002"
      - "17002:17002"
    network_mode: "host"

  valkey-node-3:
    image: valkey/valkey:8.1-alpine
    container_name: valkey-node-3
    command: >
      valkey-server
      --port 7003
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 7003
      --cluster-announce-bus-port 17003
      --bind 0.0.0.0
    ports:
      - "7003:7003"
      - "17003:17003"
    network_mode: "host"

  valkey-node-4:
    image: valkey/valkey:8.1-alpine
    container_name: valkey-node-4
    command: >
      valkey-server
      --port 7004
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 7004
      --cluster-announce-bus-port 17004
      --bind 0.0.0.0
    ports:
      - "7004:7004"
      - "17004:17004"
    network_mode: "host"

  valkey-node-5:
    image: valkey/valkey:8.1-alpine
    container_name: valkey-node-5
    command: >
      valkey-server
      --port 7005
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 7005
      --cluster-announce-bus-port 17005
      --bind 0.0.0.0
    ports:
      - "7005:7005"
      - "17005:17005"
    network_mode: "host"

  valkey-node-6:
    image: valkey/valkey:8.1-alpine
    container_name: valkey-node-6
    command: >
      valkey-server
      --port 7006
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 7006
      --cluster-announce-bus-port 17006
      --bind 0.0.0.0
    ports:
      - "7006:7006"
      - "17006:17006"
    network_mode: "host"

  valkey-cluster-creator:
    image: valkey/valkey:8.1-alpine
    depends_on:
      - valkey-node-1
      - valkey-node-2
      - valkey-node-3
      - valkey-node-4
      - valkey-node-5
      - valkey-node-6
    entrypoint: sh -c "
      sleep 5 &&
      echo yes | redis-cli --cluster create \
      127.0.0.1:7001 \
      127.0.0.1:7002 \
      127.0.0.1:7003 \
      127.0.0.1:7004 \
      127.0.0.1:7005 \
      127.0.0.1:7006 \
      --cluster-replicas 1 &&
      redis-cli -h 127.0.0.1 -p 7001 cluster nodes "
    network_mode: "host"

networks:
  valkey-cluster-net:
    driver: host
